spring:
  application:
    name: herd-health
  datasource:
    url: ${HEALTH_DB_URL:jdbc:postgresql://localhost:5432/vinabeef}
    username: ${HEALTH_DB_USER:health_app}
    password: ${HEALTH_DB_PASSWORD:}
  flyway:
    schemas: health
    default-schema: health
    create-schemas: false   # schema + role are provisioned by infra/postgres/central/01-init.sh
  devtools:
    restart:
      poll-interval: 2s
      quiet-period: 1s

health:
  security:
    # Tokens must carry iss == public issuer (what the phone/host sees); signing keys are fetched
    # from the internal Keycloak route inside Docker. See infra/oidc and docs/engineering/local-dev.md.
    public-issuer: ${OIDC_PUBLIC_ISSUER:http://localhost:8081/realms/vinabeef}
    jwk-set-uri: ${OIDC_INTERNAL_JWK_SET_URI:http://localhost:8081/realms/vinabeef/protocol/openid-connect/certs}
    # Claim used as the trusted subject id. The current-grant fixture is keyed by username.
    principal-claim: ${HEALTH_PRINCIPAL_CLAIM:preferred_username}
  authorization:
    # Explicit local-only fallback while the IAM current-grant adapter is unavailable.
    fixture-enabled: ${HEALTH_GRANTS_FIXTURE_ENABLED:false}
    fixture-location: ${HEALTH_GRANTS_FIXTURE_LOCATION:classpath:authorization-grants.demo.json}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always   # local dev only
