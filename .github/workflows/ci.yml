# PHU-05 CI. Backend build + all tests (no skipTests), test reports kept as artifacts,
# compose validated for every profile, mobile checked once mobile/ exists.
# Full-stack integration (./dev up + smoke) is Design-only for M2.
name: ci

on:
  push:
    branches: ["**"]
    tags: ["m2-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (mvn verify)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Docker is available on the runner, so Testcontainers integration tests run instead of being skipped.
      - name: Build and test
        working-directory: backend
        run: ./mvnw -B -ntp verify

      - name: Test summary (fails if nothing ran or a test was skipped)
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, os, sys
          import xml.etree.ElementTree as ET
          rows, total, skipped, bad = [], 0, 0, 0
          for path in sorted(glob.glob("backend/**/target/surefire-reports/TEST-*.xml", recursive=True)):
              s = ET.parse(path).getroot()
              t, k = int(s.get("tests", 0)), int(s.get("skipped", 0))
              f = int(s.get("failures", 0)) + int(s.get("errors", 0))
              total, skipped, bad = total + t, skipped + k, bad + f
              rows.append(f"| {s.get('name')} | {t} | {f} | {k} |")
          out = ["| Suite | Tests | Failed | Skipped |", "|---|---|---|---|", *rows,
                 f"| **Total** | **{total}** | **{bad}** | **{skipped}** |",
                 "", f"Commit `{os.environ.get('GITHUB_SHA', '')}`"]
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a") as fh:
                  fh.write("\n".join(out) + "\n")
          print("\n".join(out))
          if total == 0 or skipped > 0 or bad > 0:
              sys.exit(1)
          EOF

      - name: Keep test reports as evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ github.sha }}
          path: backend/**/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 90

  compose:
    name: compose config (all profiles)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose.yaml with .env.example
        run: |
          cp .env.example .env
          docker compose --profile apps --profile gate --profile full --profile tools config --quiet

  mobile:
    name: mobile (flutter analyze + test)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: ghcr.io/cirruslabs/flutter:3.35.7
    steps:
      - uses: actions/checkout@v4
      - name: Detect mobile project
        id: detect
        run: |
          if [ -f mobile/pubspec.yaml ]; then echo "present=true" >> "$GITHUB_OUTPUT";
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No mobile/ project in this commit; skipped." >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Analyze and test
        if: steps.detect.outputs.present == 'true'
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze
          flutter test
